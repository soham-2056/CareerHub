<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CareerHub</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="login-container">

    <div class="login-box" id="forgotBox">
        <h1>CareerHub</h1>
        <h2>Forgot Password</h2>
        <p>Enter your registered email address to receive a local password reset token.</p>
        
        <form onsubmit="handleForgotPassword(event)">
            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required>

            <button type="submit" id="sendBtn">
                Send Reset Link
            </button>
        </form>

        <div class="links">
            <a href="login.html">Back to Login</a>
        </div>
    </div>

    <div class="login-box" id="resetBox" style="display: none;">
        <h1>CareerHub</h1>
        <h2>Reset Password</h2>
        <p>Create a new secure password for your account.</p>
        
        <form onsubmit="handleResetPassword(event)">
            <input
                type="password"
                id="newPassword"
                placeholder="New Password (min 6 chars)"
                required>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm New Password"
                required>

            <button type="submit" id="resetBtn">
                Reset Password
            </button>
        </form>
    </div>

</div>

<script>
    let resetToken = "";

    async function handleForgotPassword(e) {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const sendBtn = document.getElementById("sendBtn");

        if (!email) return;

        sendBtn.disabled = true;
        sendBtn.innerText = "Processing...";

        try {
            const response = await fetch("http://localhost:5000/api/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });

            const data = await response.json();
            
            if (response.ok) {
                // If it returned a token (in development/local env)
                if (data.resetToken) {
                    resetToken = data.resetToken;
                    alert("Local password reset token received! Loading the password reset form...");
                    document.getElementById("forgotBox").style.display = "none";
                    document.getElementById("resetBox").style.display = "block";
                } else {
                    alert("If the email is registered, a reset link has been simulated.");
                }
            } else {
                alert(data.message || "Failed to process request.");
            }
        } catch (err) {
            console.error("Forgot password error:", err);
            alert("Unable to connect to the server.");
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerText = "Send Reset Link";
        }
    }

    async function handleResetPassword(e) {
        e.preventDefault();
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const resetBtn = document.getElementById("resetBtn");

        if (newPassword.length < 6) {
            alert("Password must be at least 6 characters.");
            return;
        }

        if (newPassword !== confirmPassword) {
            alert("Passwords do not match.");
            return;
        }

        resetBtn.disabled = true;
        resetBtn.innerText = "Resetting...";

        try {
            const response = await fetch(`http://localhost:5000/api/auth/reset-password/${resetToken}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ password: newPassword })
            });

            const data = await response.json();

            if (response.ok) {
                alert("Password reset successful! Redirecting to login page...");
                window.location.href = "login.html";
            } else {
                alert(data.message || "Failed to reset password.");
            }
        } catch (err) {
            console.error("Reset password error:", err);
            alert("Unable to connect to the server.");
        } finally {
            resetBtn.disabled = false;
            resetBtn.innerText = "Reset Password";
        }
    }
</script>
</body>
</html>
